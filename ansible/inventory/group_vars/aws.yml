---
ansible_user: ubuntu
ip_address: 5.6.7.8

# SSH private key for Ansible to connect to the AWS server
# Required for the initial connection to the server
ssh_pem: /Users/jjklug/.ssh/aws-test-key.pem
ansible_ssh_private_key_file: "{{ ssh_pem }}"

# github SSH key for private repo access
github_ssh_key: /Users/jjklug/.ssh/id_e25519
github_remote_private_key_path: /home/ubuntu/.ssh/id_e25519

base_utilities:
  - git
  - curl
  - wget
  - unzip
  - tar
  - vim
  - htop
  - firewalld
  - python3
  - python3-pip
  - binutils
  - net-tools
