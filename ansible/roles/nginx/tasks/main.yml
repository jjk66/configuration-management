---
- name: "Install nginx"
  ansible.builtin.apt:
    name: nginx
    state: present
  tags:
    - nginx

- name: "Copy nginx configuration file"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - restart nginx
  tags:
    - nginx

- name: "Flush handlers to apply config immediately"
  ansible.builtin.meta: flush_handlers
  tags:
    - nginx

- name: "Ensure nginx is running and enabled"
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  tags:
    - nginx